<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SpinWin Slots</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="preload" as="image" href="assets/seven7.jpg" />
  <link rel="preload" as="image" href="assets/orange.jpg" />
  <link rel="preload" as="image" href="assets/cherry.jpg" />
  <link rel="preload" as="image" href="assets/rrush.jpg" />
  <link rel="preload" as="image" href="assets/watermelon.jpg" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <canvas id="particles" aria-hidden="true"></canvas>
  <div id="flash-overlay" aria-hidden="true"></div>

  <div id="app">

    <header id="top-bar">
      <div class="brand" aria-label="SpinWin Slots">
        <span class="brand-icon" aria-hidden="true">♛</span>
        <h1 class="brand-title">SpinWin <em>Slots</em></h1>
      </div>

      <div class="top-actions">
        <button id="settingsBtn" class="icon-btn" aria-label="Open settings" title="Settings">
          ⚙
        </button>

        <div class="balance-chip" aria-label="Balance">
          <span class="chip-label">BALANCE</span>
          <span class="chip-value" id="currentPoints">1000</span>
          <span class="chip-unit">PTS</span>
        </div>
      </div>
    </header>

    <main id="game-area">
      <div id="slot-grid" aria-label="Slot grid">
        <div class="slot" id="slot1"></div>
        <div class="slot" id="slot2"></div>
        <div class="slot" id="slot3"></div>
        <div class="slot" id="slot4"></div>
        <div class="slot" id="slot5"></div>
        <div class="slot" id="slot6"></div>
        <div class="slot" id="slot7"></div>
        <div class="slot" id="slot8"></div>
        <div class="slot" id="slot9"></div>
        <div class="slot" id="slot10"></div>
        <div class="slot" id="slot11"></div>
        <div class="slot" id="slot12"></div>
        <div class="slot" id="slot13"></div>
        <div class="slot" id="slot14"></div>
        <div class="slot" id="slot15"></div>
      </div>

      <div id="win-row-label" aria-live="polite"></div>
    </main>

    <footer id="bottom-bar">
      <div class="stat-chip" aria-label="Win reward">
        <span class="chip-label">WIN</span>
        <span class="chip-value gold" id="winValue">+100</span>
        <span class="chip-unit">PTS</span>
      </div>

      <button id="spinBtn" aria-label="Spin the reels — press Space">
        <span class="btn-glyph" aria-hidden="true">◎</span>
        <span class="btn-text">SPIN</span>
        <span class="btn-hint" id="spinHint">−50 pts · SPACE</span>
      </button>

      <div id="result" role="status" aria-live="polite"></div>
    </footer>

  </div>

  <!-- Settings Modal -->
  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true"></div>

  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div id="settingsTitle" class="modal-title">Settings</div>
          <div class="modal-sub">Tune gameplay + performance.</div>
        </div>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="Close settings">✕</button>
      </div>

      <div class="modal-body">
        <div class="form-grid">
          <label class="field">
            <span>Spin Cost</span>
            <input id="spinCostInput" type="number" min="1" step="1" value="50" />
          </label>

          <label class="field">
            <span>Base Win</span>
            <input id="winRewardInput" type="number" min="1" step="1" value="100" />
          </label>

          <label class="field">
            <span>Win Chance (%)</span>
            <input id="winChanceInput" type="number" min="0" max="100" step="1" value="22" />
          </label>

          <label class="field toggle">
            <span>Sound</span>
            <input id="soundToggle" type="checkbox" checked />
          </label>

          <label class="field toggle">
            <span>Particles</span>
            <input id="particlesToggle" type="checkbox" checked />
          </label>
        </div>

        <div class="modal-note">
          Pro tip: 20–30% win chance feels “arcade fun”. 8–12% feels “casino harsh”.
        </div>
      </div>

      <div class="modal-foot">
        <button id="resetBtn" class="ghost-btn">Reset</button>
        <button id="saveBtn" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <div id="footer-credit">
    © <span id="year"></span>
    <a href="https://morecodes.in" target="_blank" rel="noopener noreferrer">morecodes.in</a>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
